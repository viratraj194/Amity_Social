{% extends "base.html" %}
{% block content %}
{% load static %}

<!-- Reset Password Page -->
<div class="login-page-wrapper">
    <div class="login-background"></div>
    <div class="login-overlay"></div>

    <div class="login-card">
        <div class="login-header">
            <h1>New Password</h1>
            <p>Create a new secure password for your account.</p>
        </div>

        <form action="{% url "reset_password" %}" method="post" class="login-form">
            {% csrf_token %}

            <div class="login-inputs">
                <div class="input-group">
                    <i class="bi bi-lock"></i>
                    <input type="password" name="password" id="passwordInput" placeholder="Enter new password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('passwordInput', 'eyeIcon1')">
                        <i class="bi bi-eye-slash" id="eyeIcon1"></i>
                    </button>
                </div>

                <div class="input-group">
                    <i class="bi bi-lock-fill"></i>
                    <input type="password" name="conform_password" id="confirmPasswordInput" placeholder="Confirm new password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('confirmPasswordInput', 'eyeIcon2')">
                        <i class="bi bi-eye-slash" id="eyeIcon2"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn">Reset Password</button>
        </form>

        <a href="{% url 'login' %}" class="back-link">
            <i class="bi bi-arrow-left"></i>
            <span>Back to Login</span>
        </a>

        <div class="login-footer">
            <i class="bi bi-shield-lock"></i>
            <span>END-TO-END ENCRYPTED</span>
        </div>
    </div>
</div>

<script>
    function togglePassword(inputId, iconId) {
        var passwordInput = document.getElementById(inputId);
        var eyeIcon = document.getElementById(iconId);
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.remove('bi-eye-slash');
            eyeIcon.classList.add('bi-eye');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.remove('bi-eye');
            eyeIcon.classList.add('bi-eye-slash');
        }
    }
</script>
{% include "includes/alerts.html" %}
{% endblock %}
