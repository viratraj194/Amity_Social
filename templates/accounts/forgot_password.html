{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vircle | Forgot Password</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-void-base: #0e0918;
            --color-elevated-surface: #1a1624;
            --color-border-smoke: rgba(62, 58, 70, 0.5);
            --color-ash-text: #d1cece;
            --color-fog-text: #9d9797;
            --color-cloud-white: #ffffff;
            --gradient-ember-cta: linear-gradient(30deg, rgb(253, 137, 37), rgb(255, 12, 0));
            --gradient-gray: linear-gradient(141deg, rgb(80, 80, 80), rgb(40, 40, 40));
            --font-display: 'DM Sans', 'Inter', sans-serif; 
        }

        body {
            background-color: transparent;
            margin: 0;
            padding: 0;
            font-family: var(--font-display);
            overflow-x: hidden;
            color: var(--color-cloud-white);
        }

        .glass-35 {
            background: rgba(26, 22, 36, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .ember-cta {
            background: var(--gradient-ember-cta);
            color: var(--color-cloud-white);
            border: none;
            border-radius: 8px;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .ember-cta:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .blur-huge { filter: blur(120px); }

        /* Form Inputs */
        .glass-input {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            transition: all 0.2s ease;
        }
        .glass-input:focus {
            outline: none;
            border-color: rgb(253, 137, 37);
            background: rgba(255,255,255,0.06);
        }
    </style>
</head>
<body class="antialiased h-screen flex flex-col">

    <!-- DYNAMIC 3D ANIMATED BACKGROUND (Gray & Orange) -->
    <div class="fixed inset-0 z-[-1] bg-[#0e0918] overflow-hidden pointer-events-none">
        <div id="orb1" class="absolute top-[10%] left-[10%] w-[500px] h-[500px] rounded-full bg-[#4a4a4c] opacity-[0.25] blur-huge will-change-transform"></div>
        <div id="orb2" class="absolute top-[50%] right-[5%] w-[700px] h-[700px] rounded-full bg-[#fd8925] opacity-[0.12] blur-huge will-change-transform"></div>
        <div id="orb3" class="absolute bottom-[-20%] left-[30%] w-[600px] h-[600px] rounded-full bg-[#2c2834] opacity-[0.3] blur-huge will-change-transform"></div>
        
        <div id="float1" class="absolute top-[15%] left-[85%] text-[15rem] opacity-[0.03] text-white font-bold rotate-12 select-none will-change-transform">🎭</div>
        <div id="float2" class="absolute top-[60%] left-[5%] text-[12rem] opacity-[0.03] text-white font-bold -rotate-12 select-none will-change-transform">🔒</div>
    </div>

    <!-- STICKY TOP NAVIGATION BAR (35% Glass) -->
    <nav class="fixed top-0 w-full z-50 h-[72px] bg-[#0e0918]/35 backdrop-blur-md border-b border-[rgba(255,255,255,0.05)] px-6 md:px-12 flex justify-between items-center transition-all duration-300 shadow-lg">
        <a href="{% url 'home' %}" class="flex flex-col justify-center">
            <span class="text-[22px] font-bold tracking-tight text-white leading-none mb-0.5">Vircle!</span>
            <span class="text-[11px] text-[#9d9797] font-medium leading-none uppercase tracking-wider">Virtual Circle</span>
        </a>
        <div class="flex gap-4 items-center">
            <a href="{% url 'login' %}" class="px-5 py-2 text-sm font-medium border border-[#e5e7eb] rounded-[6px] text-white hover:bg-white hover:text-black transition bg-transparent h-[40px] flex items-center">Log in</a>
        </div>
    </nav>

    <!-- ALERTS -->
    <div class="fixed top-[80px] w-full z-50 flex justify-center px-4 pointer-events-none">
        <div class="pointer-events-auto">
            {% include "includes/alerts.html" %}
        </div>
    </div>

    <!-- MAIN FORM -->
    <main class="flex-grow flex items-center justify-center px-6 mt-16 relative z-10">
        <div class="glass-35 rounded-[24px] p-10 w-full max-w-md shadow-2xl relative overflow-hidden">
            <!-- Subtle Top Glow -->
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[200px] h-[2px] bg-[rgb(253,137,37)] shadow-[0_0_20px_rgb(253,137,37)]"></div>

            <h1 class="text-3xl font-light text-white mb-2 text-center tracking-tight">Reset Password</h1>
            <p class="text-sm text-[#9d9797] text-center mb-8">Enter your email to receive a password reset link.</p>

            <form action="{% url 'forgot_password' %}" method="post" class="flex flex-col gap-5">
                {% csrf_token %}
                
                <div class="flex flex-col gap-2">
                    <label class="text-xs text-[#d1cece] uppercase tracking-wider font-medium ml-1">Email</label>
                    <input type="email" name="email" placeholder="Enter your email" required class="glass-input w-full h-[48px] rounded-[10px] px-4 text-sm">
                </div>

                <button type="submit" class="ember-cta w-full h-[48px] font-medium text-base mt-4 shadow-[0_4px_20px_rgba(253,137,37,0.3)]">
                    Send Reset Link
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-[rgba(255,255,255,0.05)] text-center text-sm">
                <a href="{% url 'login' %}" class="text-white hover:text-[#fd8925] font-medium transition flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Back to Login
                </a>
            </div>
            
            <div class="mt-6 flex items-center justify-center gap-2 text-xs text-[#3e3a46] font-medium uppercase tracking-widest">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                End-To-End Encrypted
            </div>
        </div>
    </main>

    <script>
        // Simple Parallax
        document.addEventListener('scroll', () => {
            const scrolled = window.scrollY;
            document.getElementById('orb1').style.transform = `translateY(${scrolled * -0.4}px)`;
            document.getElementById('orb2').style.transform = `translateY(${scrolled * -0.6}px)`;
            document.getElementById('orb3').style.transform = `translateY(${scrolled * -0.25}px)`;
            document.getElementById('float1').style.transform = `translateY(${scrolled * -0.8}px) rotate(12deg)`;
            document.getElementById('float2').style.transform = `translateY(${scrolled * -0.5}px) rotate(-12deg)`;
        });
    </script>
</body>
</html>
