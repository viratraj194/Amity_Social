{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vircle | Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-void-base: #0e0918;
            --color-elevated-surface: #1a1624;
            --color-border-smoke: rgba(62, 58, 70, 0.5);
            --color-ash-text: #d1cece;
            --color-fog-text: #9d9797;
            --color-cloud-white: #ffffff;
            --gradient-ember-cta: linear-gradient(30deg, rgb(253, 137, 37), rgb(255, 12, 0));
            --gradient-gray: linear-gradient(141deg, rgb(80, 80, 80), rgb(40, 40, 40));
            --font-display: 'DM Sans', 'Inter', sans-serif; 
        }

        body {
            background-color: transparent;
            margin: 0;
            padding: 0;
            font-family: var(--font-display);
            overflow-x: hidden;
            color: var(--color-cloud-white);
        }

        .headline-display { font-weight: 300; line-height: 0.88; letter-spacing: -0.04em; }
        .body-text { font-weight: 400; color: var(--color-ash-text); line-height: 1.6; }

        .glass-35 {
            background: rgba(26, 22, 36, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .ember-cta {
            background: var(--gradient-ember-cta);
            color: var(--color-cloud-white);
            border: none;
            border-radius: 8px;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .ember-cta:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .gray-border { position: relative; }
        .gray-border::before {
            content: "";
            position: absolute;
            left: 0; top: 0; bottom: 0; width: 4px;
            background: var(--gradient-gray);
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
        }

        .blur-huge { filter: blur(120px); }

        /* Form Inputs */
        .glass-input {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            transition: all 0.2s ease;
        }
        .glass-input:focus {
            outline: none;
            border-color: rgb(253, 137, 37);
            background: rgba(255,255,255,0.06);
        }
    </style>
</head>
<body class="antialiased h-screen flex flex-col">
    <!-- Premium Preloader -->
    <div id="vircle-preloader" style="transition-duration: 800ms;" class="fixed inset-0 z-[9999] bg-[#050505] flex items-center justify-center transition-opacity ease-in-out pointer-events-none">
        <div class="relative w-20 h-20 flex items-center justify-center">
            <div class="absolute inset-0 border-t-2 border-orange-500 rounded-full animate-spin"></div>
            <div class="absolute inset-2 border-r-2 border-white/20 rounded-full animate-[spin_1.5s_reverse_infinite]"></div>
            <div class="absolute inset-0 bg-orange-500/20 blur-xl rounded-full"></div>
            <span class="text-orange-500 font-bold text-lg tracking-tighter animate-pulse">V.</span>
        </div>
    </div>
    <script>
        window.addEventListener('load', () => {
            const preloader = document.getElementById('vircle-preloader');
            if (preloader) {
                preloader.style.opacity = '0';
                setTimeout(() => {
                    preloader.style.display = 'none';
                }, 800);
            }
        });
    </script>

    <!-- DYNAMIC 3D ANIMATED BACKGROUND (Gray & Orange) -->
    <div class="fixed inset-0 z-[-1] bg-[#0e0918] overflow-hidden pointer-events-none">
        <div id="orb1" class="absolute top-[10%] left-[10%] w-[500px] h-[500px] rounded-full bg-[#4a4a4c] opacity-[0.25] blur-huge will-change-transform"></div>
        <div id="orb2" class="absolute top-[50%] right-[5%] w-[700px] h-[700px] rounded-full bg-[#fd8925] opacity-[0.12] blur-huge will-change-transform"></div>
        <div id="orb3" class="absolute bottom-[-20%] left-[30%] w-[600px] h-[600px] rounded-full bg-[#2c2834] opacity-[0.3] blur-huge will-change-transform"></div>
        
        <div id="float1" class="absolute top-[15%] left-[85%] text-[15rem] opacity-[0.03] text-white font-bold rotate-12 select-none will-change-transform">🎭</div>
        <div id="float2" class="absolute top-[60%] left-[5%] text-[12rem] opacity-[0.03] text-white font-bold -rotate-12 select-none will-change-transform">🕵️</div>
    </div>

    <!-- STICKY TOP NAVIGATION BAR (35% Glass) -->
    <nav class="fixed top-0 w-full z-50 h-[72px] bg-[#0e0918]/35 backdrop-blur-md border-b border-[rgba(255,255,255,0.05)] px-6 md:px-12 flex justify-between items-center transition-all duration-300 shadow-lg">
        <a href="{% url 'home' %}" class="flex flex-col justify-center">
            <span class="text-[22px] font-bold tracking-tight text-white leading-none mb-0.5">Vircle!</span>
            <span class="text-[11px] text-[#9d9797] font-medium leading-none uppercase tracking-wider">Virtual Circle</span>
        </a>
        <div class="flex gap-4 items-center">
            <a href="{% url 'RegisterUser' %}" class="ember-cta px-5 py-2 text-sm font-medium flex items-center justify-center rounded-[8px] h-[40px]">Sign Up</a>
        </div>
    </nav>

    <!-- ALERTS -->
    <div class="fixed top-[80px] w-full z-50 flex justify-center px-4 pointer-events-none">
        <div class="pointer-events-auto">
            {% include "includes/alerts.html" %}
        </div>
    </div>

    <!-- MAIN LOGIN FORM -->
    <main class="flex-grow flex items-center justify-center px-6 mt-16 relative z-10">
        <div class="glass-35 rounded-[24px] p-10 w-full max-w-md shadow-2xl relative overflow-hidden">
            <!-- Subtle Top Glow -->
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[200px] h-[2px] bg-[rgb(253,137,37)] shadow-[0_0_20px_rgb(253,137,37)]"></div>

            <h1 class="text-3xl font-light text-white mb-2 text-center tracking-tight">Welcome Back</h1>
            <p class="text-sm text-[#9d9797] text-center mb-8">Enter your credentials to access your private circle.</p>

            <form action="{% url 'login' %}" method="post" class="flex flex-col gap-5">
                {% csrf_token %}
                
                <div class="flex flex-col gap-2">
                    <label class="text-xs text-[#d1cece] uppercase tracking-wider font-medium ml-1">Email</label>
                    <input type="email" name="email" placeholder="Enter your email" required class="glass-input w-full h-[48px] rounded-[10px] px-4 text-sm">
                </div>

                <div class="flex flex-col gap-2 relative">
                    <label class="text-xs text-[#d1cece] uppercase tracking-wider font-medium ml-1">Password</label>
                    <input type="password" name="password" id="passwordInput" placeholder="Enter password" required class="glass-input w-full h-[48px] rounded-[10px] px-4 text-sm pr-12">
                    <button type="button" onclick="togglePassword()" class="absolute right-4 top-[32px] text-[#9d9797] hover:text-white transition">
                        <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <!-- Eye Slash SVG (default) -->
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                        </svg>
                    </button>
                </div>

                <div class="flex justify-end">
                    <a href="{% url 'forgot_password' %}" class="text-xs text-[#fd8925] hover:text-white transition">Forgot Password?</a>
                </div>

                <button type="submit" class="ember-cta w-full h-[48px] font-medium text-base mt-2 shadow-[0_4px_20px_rgba(253,137,37,0.3)]">
                    Login
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-[rgba(255,255,255,0.05)] text-center text-sm">
                <span class="text-[#9d9797]">Still didn't join us?</span>
                <a href="{% url 'RegisterUser' %}" class="text-white hover:text-[#fd8925] font-medium transition ml-1">Sign up &rarr;</a>
            </div>
            
            <div class="mt-6 flex items-center justify-center gap-2 text-xs text-[#3e3a46] font-medium uppercase tracking-widest">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                End-To-End Encrypted
            </div>
        </div>
    </main>

    <script>
        function togglePassword() {
            var passwordInput = document.getElementById('passwordInput');
            var eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>';
            }
        }

        // Simple Parallax (Lazy Initialized)
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                document.addEventListener('scroll', () => {
                    const scrolled = window.scrollY;
                    const orb1 = document.getElementById('orb1');
                    const orb2 = document.getElementById('orb2');
                    const orb3 = document.getElementById('orb3');
                    const float1 = document.getElementById('float1');
                    const float2 = document.getElementById('float2');
                    
                    if (orb1) orb1.style.transform = `translateY(${scrolled * -0.4}px)`;
                    if (orb2) orb2.style.transform = `translateY(${scrolled * -0.6}px)`;
                    if (orb3) orb3.style.transform = `translateY(${scrolled * -0.25}px)`;
                    if (float1) float1.style.transform = `translateY(${scrolled * -0.8}px) rotate(12deg)`;
                    if (float2) float2.style.transform = `translateY(${scrolled * -0.5}px) rotate(-12deg)`;
                });
                observer.disconnect();
            }
        }, { threshold: 0 });
        
        observer.observe(document.body);
    </script>
</body>
</html>
