{% extends "base.html" %}
{% block content %}
{% load static %}

<!-- login page design starts here -->
<div class="login-page-wrapper">
    <div class="login-background"></div>
    <div class="login-overlay"></div>

    <div class="login-card">
        <div class="login-header">
            <h1>Welcome Back</h1>
            <p>Enter your credentials to access your private circle.</p>
        </div>

        <form action="{% url "login" %}" method="post" class="login-form">
            {% csrf_token %}

            <div class="login-inputs">
                <div class="input-group">
                    <i class="bi bi-envelope"></i>
                    <input type="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <i class="bi bi-lock" id="lockIcon"></i>
                    <input type="password" name="password" id="passwordInput" placeholder="Enter password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <i class="bi bi-eye-slash" id="eyeIcon"></i>
                    </button>
                </div>

                <a href="{% url "forgot_password" %}" class="forgot-link">
                    <span>Forgot Password?</span>
                </a>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <a href="{%url 'RegisterUser'%}" class="signup-link">
            <div class="signup-prompt">
                <span>Still didn't join us?</span>
                <span class="signup-text">Sign up <i class="bi bi-arrow-right"></i></span>
            </div>
        </a>

        <div class="login-footer">
            <i class="bi bi-shield-lock"></i>
            <span>END-TO-END ENCRYPTED</span>
        </div>
    </div>
</div>

<script>
    function togglePassword() {
        var passwordInput = document.getElementById('passwordInput');
        var eyeIcon = document.getElementById('eyeIcon');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.remove('bi-eye-slash');
            eyeIcon.classList.add('bi-eye');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.remove('bi-eye');
            eyeIcon.classList.add('bi-eye-slash');
        }
    }
</script>
{% include "includes/alerts.html" %}
<!-- login page design ends here -->
{% endblock %}
