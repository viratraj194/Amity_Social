<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #0f0f11;
            font-family: 'Nunito', sans-serif, system-ui;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1a24 0%, #0f0f11 60%);
        }
        .top-right-icon {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .top-right-icon:hover {
            background: rgba(255,255,255,0.05);
        }
        .main-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -80px;
            position: relative;
        }
        .error-code-container {
            position: relative;
            display: inline-block;
            margin-bottom: 24px;
        }
        .error-code {
            font-size: 180px;
            font-weight: 700;
            color: #2a2a35;
            line-height: 1;
            margin: 0;
            letter-spacing: 5px;
        }
        .error-overlap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: 700;
            color: #d4d4ff;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .heading {
            font-size: 26px;
            font-weight: 600;
            margin: 0 0 16px 0;
            color: #ffffff;
        }
        .description {
            color: #888899;
            max-width: 420px;
            margin: 0 0 40px 0;
            font-size: 15px;
            line-height: 1.6;
        }
        .buttons {
            display: flex;
            gap: 16px;
        }
        .btn {
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background-color: #b8b8ff;
            color: #000;
            border: none;
            box-shadow: 0 0 20px rgba(184, 184, 255, 0.2);
        }
        .btn-primary:hover {
            background-color: #ccccff;
            box-shadow: 0 0 30px rgba(184, 184, 255, 0.4);
        }
        .btn-secondary {
            background-color: transparent;
            color: #bbbbcc;
            border: 1px solid #333344;
        }
        .btn-secondary:hover {
            border-color: #555566;
            color: #ffffff;
        }
        .features-container {
            position: absolute;
            bottom: 40px;
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 900px;
            justify-content: center;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .feature-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: transform 0.2s, background 0.2s;
        }
        .feature-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.04);
        }
        .feature-icon {
            color: #666677;
            width: 24px;
            height: 24px;
        }
        .feature-title {
            color: #555566;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        @media (max-width: 768px) {
            .features-container {
                flex-wrap: wrap;
                bottom: 20px;
            }
            .feature-card {
                min-width: calc(50% - 20px);
                padding: 16px;
            }
            .error-code { font-size: 120px; }
            .error-overlap { font-size: 24px; }
            .main-content { margin-top: -120px; }
        }
    </style>
    <!-- Nunito Font -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Play Icon Top Right -->
    <div class="top-right-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#bbbbcc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
    </div>

    <div class="main-content">
        <div class="error-code-container">
            <div class="error-code">404</div>
            <div class="error-overlap">LOST</div>
        </div>
        
        <h1 class="heading">Lost in the Circle?</h1>
        <p class="description">The page you're looking for doesn't exist or has been moved. Let's get you back to your private space.</p>
        
        <div class="buttons">
            <a href="/" class="btn btn-primary">Back to Home</a>
            <a href="/support" class="btn btn-secondary">Support</a>
        </div>
    </div>

    <div class="features-container">
        <div class="feature-card">
            <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <div class="feature-title">Encrypted</div>
        </div>
        <div class="feature-card">
            <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <div class="feature-title">Secure Vault</div>
        </div>
        <div class="feature-card">
            <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            <div class="feature-title">Privacy First</div>
        </div>
        <div class="feature-card">
            <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            <div class="feature-title">Insights</div>
        </div>
    </div>
</body>
</html>
