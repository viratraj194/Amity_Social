{% if messages %}
<!-- SweetAlert2 CDN (Ensure it's loaded if not already in base.html) -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
    /* Vircle Glassmorphism SweetAlert2 Overrides */
    
    /* Backdrop */
    div:where(.swal2-container) {
        background: rgba(0, 0, 0, 0.8) !important;
    }

    /* Popup Modal */
    .custom-swal-popup {
        background: rgba(26, 22, 36, 0.7) !important;
        backdrop-filter: blur(16px) !important;
        -webkit-backdrop-filter: blur(16px) !important;
        border: 1px solid rgba(255, 255, 255, 0.05) !important;
        border-radius: 16px !important;
        box-shadow: 0 -2px 10px rgba(253, 137, 37, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1) !important;
        color: #ffffff !important;
        font-family: 'DM Sans', 'Inter', sans-serif !important;
    }
    
    /* Title */
    .custom-swal-title {
        color: #ffffff !important;
        font-weight: 300 !important;
        font-size: 1.75rem !important;
        letter-spacing: -0.02em !important;
    }

    /* Body Text */
    .custom-swal-text {
        color: #a3a3a3 !important;
        font-size: 0.95rem !important;
        line-height: 1.5 !important;
    }

    /* Confirm Button */
    .custom-swal-confirm-btn {
        background: linear-gradient(90deg, #fd8925, #ff0c00) !important;
        border: none !important;
        border-radius: 8px !important;
        padding: 12px 32px !important;
        font-weight: 500 !important;
        color: #ffffff !important;
        box-shadow: none !important;
        transition: all 0.2s ease !important;
        cursor: pointer !important;
        outline: none !important;
    }
    .custom-swal-confirm-btn:hover {
        box-shadow: 0 4px 15px rgba(253, 137, 37, 0.4) !important;
        transform: translateY(-2px) !important;
        filter: brightness(1.1) !important;
    }

    /* Customizing SweetAlert Icons (Success) */
    .swal2-icon.swal2-success {
        border-color: #fd8925 !important;
    }
    .swal2-icon.swal2-success [class^="swal2-success-line"] {
        background-color: #fd8925 !important;
    }
    .swal2-icon.swal2-success .swal2-success-ring {
        border-color: rgba(253, 137, 37, 0.3) !important;
    }

    /* Customizing SweetAlert Icons (Error) */
    .swal2-icon.swal2-error {
        border-color: #fd8925 !important;
    }
    .swal2-icon.swal2-error [class^="swal2-x-mark-line"] {
        background-color: #fd8925 !important;
    }

    /* Customizing SweetAlert Icons (Warning / Info) */
    .swal2-icon.swal2-warning, .swal2-icon.swal2-info {
        border-color: #fd8925 !important;
        color: #fd8925 !important;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", async function () {
        // Collect all messages from Django
        const messages = [
            {% for message in messages %}
            {
                text: "{{ message|escapejs }}",
                tags: "{{ message.tags|default:'' }}".toLowerCase()
            },
            {% endfor %}
        ];

        // Process messages sequentially using async/await
        for (const msg of messages) {
            let swalIcon = 'info';
            let swalTitle = 'Notification';

            if (msg.tags.includes('success')) {
                swalIcon = 'success';
                swalTitle = 'Success';
            } else if (msg.tags.includes('error') || msg.tags.includes('danger')) {
                swalIcon = 'error';
                swalTitle = 'Error';
            } else if (msg.tags.includes('warning')) {
                swalIcon = 'warning';
                swalTitle = 'Warning';
            }

            await Swal.fire({
                title: swalTitle,
                text: msg.text,
                icon: swalIcon,
                buttonsStyling: false, // Fully unstyle default buttons
                confirmButtonText: 'Continue',
                customClass: {
                    popup: 'custom-swal-popup',
                    title: 'custom-swal-title',
                    htmlContainer: 'custom-swal-text',
                    confirmButton: 'custom-swal-confirm-btn',
                }
            });
        }
    });
</script>
{% endif %}
