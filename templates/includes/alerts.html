{% if messages %}
<!-- SweetAlert2 CDN (Ensure it's loaded if not already in base.html) -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
    /* Custom styles matching the specific UI requirements */
    .custom-swal-popup {
        border-radius: 24px !important; /* approx 3xl rounded corners */
        background-color: #1e1e1e !important; /* Dark theme background */
        color: #ffffff !important;
    }
    
    .custom-swal-title {
        text-align: center !important;
        font-weight: 600 !important;
    }

    .custom-swal-text {
        text-align: center !important;
        color: #cccccc !important;
    }

    .custom-swal-confirm-btn {
        border-radius: 9999px !important; /* Pill style */
        padding: 12px 32px !important;
        font-weight: bold !important;
        min-width: 100px;
    }

    .custom-swal-cancel-btn {
        border-radius: 9999px !important; /* Pill style */
        padding: 12px 32px !important;
        font-weight: bold !important;
        background-color: #333333 !important; /* Dark gray for cancel/No */
        color: #ffffff !important;
        min-width: 100px;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", async function () {
        // Collect all messages from Django
        const messages = [
            {% for message in messages %}
            {
                text: "{{ message|escapejs }}",
                tags: "{{ message.tags|default:'' }}".toLowerCase()
            },
            {% endfor %}
        ];

        // Process messages sequentially using async/await so they don't overlap
        for (const msg of messages) {
            let swalIcon = 'info';
            let btnColor = '#3085d6'; // Default blue
            let swalTitle = 'Notification';

            // Map Django message levels to icons and button colors
            if (msg.tags.includes('success')) {
                swalIcon = 'success';
                btnColor = '#4caf50'; // Green
                swalTitle = 'Success';
            } else if (msg.tags.includes('error') || msg.tags.includes('danger')) {
                swalIcon = 'error';
                btnColor = '#d33'; // Red
                swalTitle = 'Error';
            } else if (msg.tags.includes('warning')) {
                swalIcon = 'warning';
                btnColor = '#ff9800'; // Orange/Peach color matching the reference
                swalTitle = 'Warning';
            } else {
                swalIcon = 'info';
                btnColor = '#3085d6'; // Blue
                swalTitle = 'Information';
            }

            await Swal.fire({
                title: swalTitle,
                text: msg.text,
                icon: swalIcon,
                background: '#1e1e1e',
                color: '#ffffff',
                confirmButtonColor: btnColor,
                confirmButtonText: 'OK',
                // Show cancel button only if we want to emulate the Yes/No look exactly, 
                // but for standard messages, usually one button is enough.
                // showCancelButton: true, 
                // cancelButtonText: 'No',
                customClass: {
                    popup: 'custom-swal-popup',
                    title: 'custom-swal-title',
                    htmlContainer: 'custom-swal-text',
                    confirmButton: 'custom-swal-confirm-btn',
                    cancelButton: 'custom-swal-cancel-btn'
                }
            });
        }
    });
</script>
{% endif %}
