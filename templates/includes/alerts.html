{% if messages %}
<!-- SweetAlert2 & Tailwind CSS CDN (Ensure it's loaded if not already in base.html) -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
    /* Custom styles matching the specific UI requirements */
    .custom-swal-popup {
        border-radius: 24px !important; /* approx 3xl rounded corners */
        background-color: #1e1e1e !important; /* Dark theme background */
        color: #ffffff !important;
    }
    
    .custom-swal-title {
        text-align: center !important;
        font-weight: 600 !important;
    }

    .custom-swal-text {
        text-align: center !important;
        color: #cccccc !important;
    }

    .custom-swal-confirm-btn {
        border-radius: 9999px !important; /* Pill style */
        padding: 12px 32px !important;
        font-weight: bold !important;
        min-width: 100px;
    }

    .custom-swal-cancel-btn {
        border-radius: 9999px !important; /* Pill style */
        padding: 12px 32px !important;
        font-weight: bold !important;
        background-color: #333333 !important; /* Dark gray for cancel/No */
        color: #ffffff !important;
        min-width: 100px;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", async function () {
        // Collect all messages from Django
        const messages = [
            {% for message in messages %}
            {
                text: "{{ message|escapejs }}",
                tags: "{{ message.tags|default:'' }}".toLowerCase()
            },
            {% endfor %}
        ];

        // Process messages sequentially using async/await so they don't overlap
        for (const msg of messages) {
            let swalIcon = 'info';
            let btnColor = '#3085d6'; // Default blue
            let swalTitle = 'Notification';

            // Map Django message levels to icons and button colors
            if (msg.tags.includes('success')) {
                swalIcon = 'success';
                btnColor = '#4caf50'; // Green
                swalTitle = 'Success';
            } else if (msg.tags.includes('error') || msg.tags.includes('danger')) {
                swalIcon = 'error';
                btnColor = '#d33'; // Red
                swalTitle = 'Error';
            } else if (msg.tags.includes('warning')) {
                swalIcon = 'warning';
                btnColor = '#ff9800'; // Orange/Peach color matching the reference
                swalTitle = 'Warning';
            } else {
                swalIcon = 'info';
                btnColor = '#3085d6'; // Blue
                swalTitle = 'Information';
            }

            await Swal.fire({
                title: swalTitle,
                text: msg.text,
                icon: swalIcon,
                iconColor: '#fd8925',
                background: '#0f0f0f',
                color: '#ffffff',
                backdrop: `rgba(9, 6, 17, 0.85) backdrop-filter backdrop-blur-sm`,
                confirmButtonText: 'OK',
                buttonsStyling: false,
                customClass: {
                    popup: 'border border-white/10 rounded-3xl shadow-2xl',
                    title: 'text-2xl font-bold',
                    htmlContainer: 'text-[#9ca3af]',
                    confirmButton: 'bg-gradient-to-r from-[#fd8925] to-[#ff0c00] text-white px-8 py-3 rounded-full font-semibold hover:scale-105 transition-transform duration-300 shadow-lg shadow-[#fd8925]/20 mt-4'
                }
            });
        }
    });
</script>
{% endif %}
